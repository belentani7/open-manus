name: Windows OpenManus scripts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline PowerShell launcher and updater tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
